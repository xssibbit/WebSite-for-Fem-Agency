<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FEM Agency</title>
<!-- FEM_BUILD: 2026-08-05-v4-bootstrap-hotfix -->
<style>
html,body{margin:0;min-height:100%;background:#060612;color:#fff;font-family:Arial,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
#boot b{font-size:18px}#boot small{display:block;margin-top:10px;opacity:.65}
</style>
</head>
<body>
<div id="boot"><div><b>FEM Agency</b><small>Загрузка сайта…</small></div></div>
<script>
(async()=>{
  const source="https://raw.githubusercontent.com/xssibbit/WebSite-for-Fem-Agency/0b5477116dbdaf22c6c5137a073329140ba7645d/index.html";
  const before="    const mo=new MutationObserver(records=>records.forEach(record=>{\n      const state=record.target;\n      if(state.classList.contains('is-active'))runProcess(state);\n      else state.classList.remove('fem-process-live','fem-process-pending');\n    }));\n    states.forEach(state=>mo.observe(state,{attributes:true,attributeFilter:['class']}));";
  const after="    /* Observe only real is-active transitions.\n       The previous version reacted to every class change and then changed the\n       same class attribute again, creating an endless MutationObserver loop. */\n    const mo=new MutationObserver(records=>records.forEach(record=>{\n      const state=record.target;\n      const oldClasses=(record.oldValue||'').split(/\\s+/);\n      const wasActive=oldClasses.includes('is-active');\n      const isActive=state.classList.contains('is-active');\n\n      // Ignore animation-class changes made by runProcess itself.\n      if(wasActive===isActive)return;\n\n      if(isActive)runProcess(state);\n      else state.classList.remove('fem-process-live','fem-process-pending');\n    }));\n    states.forEach(state=>mo.observe(state,{\n      attributes:true,\n      attributeFilter:['class'],\n      attributeOldValue:true\n    }));";
  const response=await fetch(source,{cache:'no-store'});
  if(!response.ok)throw new Error('Source HTTP '+response.status);
  let html=await response.text();
  if(!html.includes(before))throw new Error('V4 patch target was not found');
  html=html.replace(
    '<meta name="viewport" content="width=device-width,initial-scale=1.0"/>',
    '<meta name="viewport" content="width=device-width,initial-scale=1.0"/>\n<!-- FEM_BUILD: 2026-08-05-v4-mutation-observer-hotfix -->'
  );
  html=html.replace(before,after);
  document.open('text/html','replace');
  document.write(html);
  document.close();
})().catch(error=>{
  console.error(error);
  const boot=document.getElementById('boot');
  if(boot)boot.innerHTML='<div><b>Не удалось загрузить сайт</b><small>Обновите страницу через Ctrl + Shift + R.</small></div>';
});
</script>
</body>
</html>
