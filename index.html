      const state=record.target;
      if(state.classList.contains('is-active'))runProcess(state);
      else state.classList.remove('fem-process-live','fem-process-pending');
    }));
    states.forEach(state=>mo.observe(state,{attributes:true,attributeFilter:['class']}));`;

  const observerAfter=`    /* Observe only real is-active transitions. */
    const mo=new MutationObserver(records=>records.forEach(record=>{
      const state=record.target;
      const oldClasses=(record.oldValue||'').split(/\\s+/);
      const wasActive=oldClasses.includes('is-active');
      const isActive=state.classList.contains('is-active');
      if(wasActive===isActive)return;
      if(isActive)runProcess(state);
      else state.classList.remove('fem-process-live','fem-process-pending');

    states.forEach(state=>mo.observe(state,{

      attributeFilter:['class'],

  const v6Js=`<script id="fem-v6-behavior">
(function(){
  function initFaq(){
    const items=[...document.querySelectorAll('#faq .fi')];
    items.forEach((item,index)=>{
      const button=item.querySelector('.fq');
      const answer=item.querySelector('.fa');
      if(!button||!answer)return;

      const answerId='fem-faq-answer-'+index;
      answer.id=answerId;
      button.type='button';
      button.setAttribute('aria-controls',answerId);
      button.setAttribute('aria-expanded',item.classList.contains('op')?'true':'false');
      answer.setAttribute('aria-hidden',item.classList.contains('op')?'false':'true');

      button.addEventListener('click',function(event){
        event.preventDefault();
        event.stopPropagation();

        const willOpen=!item.classList.contains('op');
        items.forEach(other=>{
          other.classList.remove('op');
          const otherButton=other.querySelector('.fq');
          const otherAnswer=other.querySelector('.fa');
          if(otherButton)otherButton.setAttribute('aria-expanded','false');
          if(otherAnswer)otherAnswer.setAttribute('aria-hidden','true');
        });

        if(willOpen){
          item.classList.add('op');
          button.setAttribute('aria-expanded','true');
          answer.setAttribute('aria-hidden','false');
        }
      });
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',initFaq,{once:true});
  }else{
    initFaq();
  }
})();
<\/script>`;

  const response=await fetch(source,{cache:'no-store'});
  if(!response.ok)throw new Error('Source HTTP '+response.status);
  let page=await response.text();

  page=page.replace(
    '<meta name="viewport" content="width=device-width,initial-scale=1.0"/>',
    '<meta name="viewport" content="width=device-width,initial-scale=1.0"/>\\n<!-- FEM_BUILD: 2026-08-05-v6-theme-faq-process-mobile -->'
  );

  page=page
    .replaceAll('assets/photos/about-1.webp','assets/visual/photo-1.webp')
    .replaceAll('assets/photos/about-2.webp','assets/visual/photo-2.webp')
    .replaceAll('assets/photos/about-3.webp','assets/visual/photo-3.webp');

  if(page.includes(observerBefore))page=page.replace(observerBefore,observerAfter);
  page=page.replace('</head>',v6Css+'\\n</head>');
  page=page.replace('</body>',v6Js+'\\n</body>');

  document.open('text/html','replace');
  document.write(page);
  document.close();
})().catch(error=>{
  console.error(error);
  document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#060612;color:#fff;font:16px Arial;text-align:center">Не удалось открыть сайт. Обновите страницу.</main>';
});
