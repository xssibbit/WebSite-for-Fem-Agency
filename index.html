<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FEM Agency</title>
<!-- FEM_BUILD: 2026-08-05-v5-bootstrap-no-visible-loader -->
<style>
html,body{margin:0;min-height:100%;background:#060612}
/* No loading screen or loading text is rendered. */
</style>
</head>
<body>
<script>
(async()=>{
  const source="https://raw.githubusercontent.com/xssibbit/WebSite-for-Fem-Agency/0b5477116dbdaf22c6c5137a073329140ba7645d/index.html";
  const observerBefore="    const mo=new MutationObserver(records=>records.forEach(record=>{\n      const state=record.target;\n      if(state.classList.contains('is-active'))runProcess(state);\n      else state.classList.remove('fem-process-live','fem-process-pending');\n    }));\n    states.forEach(state=>mo.observe(state,{attributes:true,attributeFilter:['class']}));";
  const observerAfter="    /* Observe only real is-active transitions. */\n    const mo=new MutationObserver(records=>records.forEach(record=>{\n      const state=record.target;\n      const oldClasses=(record.oldValue||'').split(/\\s+/);\n      const wasActive=oldClasses.includes('is-active');\n      const isActive=state.classList.contains('is-active');\n      if(wasActive===isActive)return;\n      if(isActive)runProcess(state);\n      else state.classList.remove('fem-process-live','fem-process-pending');\n    }));\n    states.forEach(state=>mo.observe(state,{attributes:true,attributeFilter:['class'],attributeOldValue:true}));";
  const finalCss="<style id=\"fem-v5-visual-fixes\">\n/* ═════ FEM V5 — visual corrections requested 2026-08-05 ═════ */\n\n/* 1) About: always display real repository photos. */\n#about .photo-mosaic{\n  min-height:412px!important;\n}\n#about .pm-c{\n  display:block!important;\n  opacity:1!important;\n  visibility:visible!important;\n  background-size:cover!important;\n  background-repeat:no-repeat!important;\n  background-position:center!important;\n  background-color:#ece9f1!important;\n  box-shadow:0 18px 48px rgba(38,24,62,.08)!important;\n}\n#about .pm-c:nth-child(1){background-position:center 24%!important}\n#about .pm-c:nth-child(2){background-position:center 30%!important}\n#about .pm-c:nth-child(3){background-position:center 28%!important}\n#about .pm-c:before,\n#about .pm-c:after,\n#about .pm-c .pm-emoji,\n#about .pm-c>div{\n  display:none!important;\n}\n\n/* 2) Process: replace the cyan chapter with a FEM pink–violet gradient. */\n.fem-process,\n[data-theme=\"light\"] .fem-process,\n[data-theme=\"dark\"] .fem-process{\n  background:linear-gradient(135deg,#ff9fce 0%,#c792ff 48%,#7fa8ff 100%)!important;\n  color:#15101d!important;\n  box-shadow:0 34px 90px rgba(111,76,178,.18)!important;\n}\n.fem-process .sl{color:#4b214f!important}\n.fem-process .st,\n.fem-process .st span{\n  color:#15101d!important;\n  -webkit-text-fill-color:#15101d!important;\n  background:none!important;\n}\n.fem-process .fem-process-tabs button{\n  color:rgba(21,16,29,.52)!important;\n  border-bottom-color:rgba(21,16,29,.18)!important;\n}\n.fem-process .fem-process-tabs button.is-active,\n.fem-process .fem-process-tabs button.is-active strong{\n  color:#15101d!important;\n}\n.fem-process .fem-process-tabs button.is-active b{color:#fff!important}\n.fem-process .fem-process-tabs small{color:rgba(21,16,29,.60)!important}\n\n/* 3) Application: remove the large black outer background. */\n#apply,\n[data-theme=\"light\"] #apply,\n[data-theme=\"dark\"] #apply{\n  background:transparent!important;\n  color:var(--tx)!important;\n  box-shadow:none!important;\n  border:0!important;\n  overflow:visible!important;\n}\n#apply:before,\n#apply:after{\n  display:none!important;\n  content:none!important;\n}\n#apply .sl{color:var(--pink)!important}\n#apply .st,\n#apply .st span{\n  color:var(--tx)!important;\n  -webkit-text-fill-color:var(--tx)!important;\n  background:none!important;\n}\n#apply .ss,\n#apply .af{color:var(--tx2)!important}\n#apply .af-ic{\n  width:22px!important;\n  height:22px!important;\n  border-radius:50%!important;\n  background:var(--grad)!important;\n  color:#fff!important;\n  font-size:10px!important;\n}\n#apply .form-c,\n[data-theme=\"light\"] #apply .form-c,\n[data-theme=\"dark\"] #apply .form-c{\n  background:var(--card-bg)!important;\n  border:1px solid var(--border2)!important;\n  box-shadow:0 26px 70px rgba(35,20,55,.10)!important;\n  backdrop-filter:blur(18px)!important;\n  -webkit-backdrop-filter:blur(18px)!important;\n  border-radius:26px!important;\n  padding:30px!important;\n}\n#apply .fg label{color:var(--tx3)!important}\n#apply .fg input,\n#apply .fg select,\n[data-theme=\"light\"] #apply .fg input,\n[data-theme=\"light\"] #apply .fg select,\n[data-theme=\"dark\"] #apply .fg input,\n[data-theme=\"dark\"] #apply .fg select{\n  color:var(--tx)!important;\n  background:var(--input-bg)!important;\n  border:1px solid var(--border)!important;\n  border-radius:12px!important;\n  padding:14px 15px!important;\n}\n#apply .fg input::placeholder{color:var(--tx3)!important}\n#apply .fsub{\n  width:100%!important;\n  max-width:none!important;\n  color:#fff!important;\n  background:var(--grad2)!important;\n}\n\n/* 4) Mobile hero: video fills the screen; both CTAs sit over its bottom edge. */\n@media(max-width:960px){\n  .hero{\n    position:relative!important;\n    min-height:100svh!important;\n    height:100svh!important;\n    padding:0!important;\n    margin:0!important;\n    display:block!important;\n    overflow:hidden!important;\n    background:#060612!important;\n  }\n  .hero-in{\n    position:relative!important;\n    width:100%!important;\n    max-width:none!important;\n    min-height:100svh!important;\n    height:100svh!important;\n    margin:0!important;\n    padding:0!important;\n    display:block!important;\n  }\n  .hero-mobile-bg{display:none!important}\n  .h-right{\n    position:absolute!important;\n    inset:0!important;\n    z-index:1!important;\n    width:100%!important;\n    height:100%!important;\n    display:block!important;\n    opacity:1!important;\n    visibility:visible!important;\n    transform:none!important;\n  }\n  .hero-video-only{\n    position:absolute!important;\n    inset:0!important;\n    width:100%!important;\n    height:100%!important;\n    max-width:none!important;\n    aspect-ratio:auto!important;\n    border:0!important;\n    border-radius:0!important;\n    box-shadow:none!important;\n    background:#060612 url('assets/hero-mobile-poster.jpg?v=9') center/cover no-repeat!important;\n  }\n  .hero-video-only .hero-video-example{\n    position:absolute!important;\n    inset:0!important;\n    width:100%!important;\n    height:100%!important;\n    object-fit:cover!important;\n    object-position:center center!important;\n    display:block!important;\n    opacity:1!important;\n    visibility:visible!important;\n    filter:brightness(.91) contrast(1.03) saturate(1.03)!important;\n  }\n  .h-left{\n    position:absolute!important;\n    left:0!important;\n    right:0!important;\n    bottom:max(26px,env(safe-area-inset-bottom))!important;\n    z-index:4!important;\n    width:auto!important;\n    max-width:none!important;\n    padding:0 16px!important;\n    margin:0!important;\n    display:block!important;\n    text-align:center!important;\n  }\n  .h-left:before{\n    content:'';\n    position:absolute;\n    z-index:-1;\n    left:0;\n    right:0;\n    bottom:-28px;\n    height:150px;\n    pointer-events:none;\n    background:linear-gradient(180deg,transparent,rgba(6,6,18,.46) 44%,rgba(6,6,18,.72));\n  }\n  [data-theme=\"light\"] .h-left:before{\n    background:linear-gradient(180deg,transparent,rgba(248,245,255,.42) 44%,rgba(248,245,255,.68));\n  }\n  .eyebrow,\n  .hero h1,\n  .hero-sub,\n  .hstats{\n    display:none!important;\n    opacity:0!important;\n    visibility:hidden!important;\n  }\n  .hbtns{\n    position:relative!important;\n    z-index:5!important;\n    width:100%!important;\n    max-width:430px!important;\n    margin:0 auto!important;\n    padding:0!important;\n    display:flex!important;\n    flex-direction:row!important;\n    align-items:center!important;\n    justify-content:center!important;\n    gap:10px!important;\n    opacity:1!important;\n    visibility:visible!important;\n    transform:none!important;\n  }\n  .hbtns .bp,\n  .hbtns .bg2{\n    flex:1 1 0!important;\n    width:auto!important;\n    min-width:0!important;\n    height:54px!important;\n    padding:0 12px!important;\n    border-radius:999px!important;\n    display:flex!important;\n    align-items:center!important;\n    justify-content:center!important;\n    white-space:nowrap!important;\n    font-size:14px!important;\n    font-weight:800!important;\n  }\n  .hbtns .bg2{\n    color:#fff!important;\n    background:rgba(255,255,255,.18)!important;\n    border:1px solid rgba(255,255,255,.34)!important;\n    backdrop-filter:blur(18px)!important;\n    -webkit-backdrop-filter:blur(18px)!important;\n  }\n  [data-theme=\"light\"] .hbtns .bg2{\n    color:#fff!important;\n    background:rgba(255,255,255,.20)!important;\n    border-color:rgba(255,255,255,.38)!important;\n  }\n}\n@media(max-width:370px){\n  .h-left{padding-left:10px!important;padding-right:10px!important}\n  .hbtns{gap:7px!important}\n  .hbtns .bp,.hbtns .bg2{font-size:12.5px!important;padding:0 8px!important}\n  .hbtns .tg-logo{display:none!important}\n}\n</style>";

  const response=await fetch(source,{cache:'no-store'});
  if(!response.ok)throw new Error('Source HTTP '+response.status);
  let html=await response.text();

  html=html.replace(
    '<meta name="viewport" content="width=device-width,initial-scale=1.0"/>',
    '<meta name="viewport" content="width=device-width,initial-scale=1.0"/>\n<!-- FEM_BUILD: 2026-08-05-v5-visual-fixes-no-loader -->'
  );

  html=html
    .replaceAll('assets/photos/about-1.webp','assets/visual/photo-1.webp')
    .replaceAll('assets/photos/about-2.webp','assets/visual/photo-2.webp')
    .replaceAll('assets/photos/about-3.webp','assets/visual/photo-3.webp');

  if(html.includes(observerBefore))html=html.replace(observerBefore,observerAfter);
  if(!html.includes('id="fem-v5-visual-fixes"'))html=html.replace('</head>',finalCss+'\n</head>');

  document.open('text/html','replace');
  document.write(html);
  document.close();
})().catch(error=>{
  console.error(error);
  document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#060612;color:#fff;font:16px Arial;text-align:center">Не удалось открыть сайт. Обновите страницу.</main>';
});
</script>
</body>
</html>
